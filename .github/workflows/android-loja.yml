# Monta o arquivo .aab da Google Play do Orolon Caixinhas, assinado com a chave de envio.
# Roda só quando você pedir: aba Actions -> "App Android (loja)" -> Run workflow.
# Precisa dos segredos CX_CHAVE_BASE64, CX_CHAVE_SENHA e CX_CHAVE_ALIAS (veja ANDROID.md).
# Com "ensaio" marcado ele usa uma chave descartável, criada na hora: serve para provar que o .aab sai, antes de existir a
# chave de verdade. O .aab do ensaio NÃO serve para a loja.
name: App Android (loja)

on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Ensaio: usa uma chave descartável só para testar se o build funciona (o .aab não serve para a loja)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conferir os segredos
        env:
          B64: ${{ secrets.CX_CHAVE_BASE64 }}
          SENHA: ${{ secrets.CX_CHAVE_SENHA }}
          ALIAS: ${{ secrets.CX_CHAVE_ALIAS }}
        run: |
          if [ "${{ inputs.ensaio }}" = "true" ]; then echo "Ensaio com chave descartável"; exit 0; fi
          if [ -z "$B64" ] || [ -z "$SENHA" ] || [ -z "$ALIAS" ]; then
            echo "::error title=Segredos::Faltam os segredos da chave (CX_CHAVE_BASE64, CX_CHAVE_SENHA, CX_CHAVE_ALIAS). Veja ANDROID.md."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        # versões fixas pelo package-lock.json, as mesmas do APK de teste
        run: npm ci --no-audit --no-fund

      - name: Montar o projeto Android
        run: |
          # CX_LOJA=1: o app fica sabendo que é o da loja (DA_LOJA) e o projeto fica sem o .teste no identificador e no nome
          CX_LOJA=1 npm run www
          npx cap add android
          CX_LOJA=1 node scripts/plugin-android.mjs
          mkdir -p assets
          cp android-assets/*.png assets/
          npx @capacitor/assets generate --android --iconBackgroundColor "#14111F" --iconBackgroundColorDark "#14111F" --splashBackgroundColor "#14111F" --splashBackgroundColorDark "#14111F"
          npx cap sync android
          # o pacote da loja é o com.joah.caixinhas, sem o sufixo do APK de teste
          if grep -q "applicationIdSuffix" android/app/build.gradle; then echo "::error title=Identificador::O pacote da loja ficou com o applicationIdSuffix do APK de teste"; exit 1; fi

      - name: Colocar a chave de envio
        env:
          B64: ${{ secrets.CX_CHAVE_BASE64 }}
        run: |
          if [ "${{ inputs.ensaio }}" = "true" ]; then
            keytool -genkeypair -keystore android/caixinhas-envio.jks -storetype PKCS12 -storepass ensaio123 -keypass ensaio123 -alias ensaio -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Ensaio"
          else
            echo "$B64" | base64 -d > android/caixinhas-envio.jks
          fi
          node scripts/chave-loja-android.mjs | tee versao.txt
          echo "VERSAO=$(grep -oP "const VERSION = '\K[0-9.]+" index.html)" >> "$GITHUB_ENV"

      - name: Gerar o .aab assinado
        env:
          CX_CHAVE_SENHA: ${{ inputs.ensaio && 'ensaio123' || secrets.CX_CHAVE_SENHA }}
          CX_CHAVE_ALIAS: ${{ inputs.ensaio && 'ensaio' || secrets.CX_CHAVE_ALIAS }}
          SUFIXO: ${{ inputs.ensaio && '-ensaio' || '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "../Caixinhas-${VERSAO}${SUFIXO}.aab"
          rm -f caixinhas-envio.jks

      - name: Permissões que ficaram no app
        run: |
          # o manifesto final (já com o que as bibliotecas acrescentam): não pode haver permissão de internet
          M=$(find android/app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*" 2>/dev/null | head -1)
          if [ -z "$M" ]; then echo "::error title=Permissões::manifesto final não encontrado para conferir"; exit 1; fi
          PERMS=$(grep -o '<uses-permission[^>]*>' "$M" | grep -o 'android:name="[^"]*"' | sed 's/android:name="//; s/"$//' | sort -u || true)
          echo "$PERMS"
          {
            echo "## Pacote da loja"
            echo
            echo "$(cat versao.txt)${{ inputs.ensaio && ' — ENSAIO, chave descartável: não serve para a loja' || '' }}"
            echo
            echo "Permissões:"
            echo
            echo "$PERMS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'android.permission.INTERNET"' "$M"; then echo "::error title=Permissões::O app ficou com a permissão de internet"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Caixinhas-${{ env.VERSAO }}-${{ inputs.ensaio && 'ensaio' || 'google-play' }}
          path: Caixinhas-*.aab
          retention-days: 30
